; Transfer Web 配置示例。
; 复制为 /etc/transfer-web/config.ini（或仓库根目录下的 config.ini）后按需修改。

[server]
; 只监听本机，对外访问交给 tailscale serve（见 README）。
listen = 127.0.0.1
; 默认只接受经 tailscale serve 转发、带 Tailscale 身份的请求：直接访问端口、
; 经 Funnel 或从打了 tag 的设备访问都会被拒绝。此时 listen 必须是本机地址。
; 改用其他反向代理并自行做好认证时才设为 no。
require_tailscale = yes
port = 8756
; 任务历史和 SSH 连接复用的 socket；相对路径相对于本配置文件所在目录。
state_dir = /var/lib/transfer-web
log_dir = /var/log/transfer-web
; 填写后只有这些 Tailscale 账号能访问（逗号或空格分隔）；留空表示 tailnet 里
; 所有用户都能访问。install.sh 会自动填上这台机器所属的 Tailscale 账号。
allowed_users =
; 最多保留多少条任务历史，以及传输日志保留天数（0 表示不按天清理）。
history_limit = 200
log_retention_days = 30

[ui]
title = Transfer
; 左右两侧默认显示哪个端点（填下面 [endpoint:<id>] 里的 id）。
left = remote
right = local

; 每个 [endpoint:<id>] 是一台服务器。id 只能用字母、数字、下划线和短横线，
; name 是页面上显示的名字，可以随便取。
; rsync 要求每次传输至少有一端是运行本服务的机器（type = local）。

[endpoint:local]
name = 本机
type = local
root = /home/me
; 可选：服务以 root 运行时，传到这里的文件归属哪个用户（用户 或 用户:组）。
; owner = me

[endpoint:remote]
name = 远端服务器
type = ssh
; 推荐填 Tailscale 的机器名（MagicDNS）或 100.x.y.z 地址。
host = my-server
user = ubuntu
port = 22
root = /home/ubuntu
; SSH 私钥；留空则使用运行用户的默认密钥。
identity_file = /etc/transfer-web/id_ed25519
; 固定主机指纹的 known_hosts 文件（见 README“固定主机指纹”）；
; 留空则使用运行用户的 ~/.ssh/known_hosts。指纹不匹配时一律拒绝连接。
known_hosts = /etc/transfer-web/known_hosts
; 远端 python3 的路径（列目录用）。
; python = python3
