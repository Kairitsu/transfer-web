<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Transfer</title>
  <script>
    (() => {
      let savedTheme = null;
      try {
        const value = localStorage.getItem("transfer-web-theme");
        if (value === "light" || value === "dark") savedTheme = value;
      } catch (error) {
        // Fall back to the system preference when browser storage is unavailable.
      }
      document.documentElement.dataset.theme = savedTheme ||
        (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=transfer-web-20260711-3">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Transfer</h1>
        <p id="taskLine">就绪</p>
      </div>
      <div class="top-actions">
        <label class="toggle-control" for="showHidden">
          <input id="showHidden" type="checkbox" role="switch">
          <span class="toggle-track" aria-hidden="true"></span>
          <span>显示隐藏文件</span>
        </label>
        <button id="refreshAll" class="icon-button" title="刷新两侧目录">⟳</button>
        <button id="stopTask" class="danger" title="停止当前任务">停止任务</button>
        <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="切换到亮色主题" title="切换到亮色主题">
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="workspace">
      <section class="pane" data-side="us">
        <div class="pane-head">
          <div>
            <h2>美国</h2>
            <p>/home/ubuntu/<span id="usPathLabel"></span></p>
          </div>
          <div class="pane-actions">
            <span id="usPaneStatus" class="pane-status"></span>
            <button id="usUp" class="icon-button" title="返回上级">↑</button>
            <button id="usRefresh" class="icon-button" title="刷新目录">⟳</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="check-col"></th>
                <th>名称</th>
                <th class="size-col">大小</th>
                <th class="time-col">修改时间</th>
              </tr>
            </thead>
            <tbody id="usList"></tbody>
          </table>
        </div>
      </section>

      <section class="center-rail">
        <button id="copyToKr" class="primary" title="美国 → 韩国">美国 → 韩国</button>
        <button id="copyToUs" class="primary" title="韩国 → 美国">韩国 → 美国</button>
      </section>

      <section class="pane" data-side="kr">
        <div class="pane-head">
          <div>
            <h2>韩国</h2>
            <p>/home/azureuser/<span id="krPathLabel"></span></p>
          </div>
          <div class="pane-actions">
            <span id="krPaneStatus" class="pane-status"></span>
            <button id="krUp" class="icon-button" title="返回上级">↑</button>
            <button id="krRefresh" class="icon-button" title="刷新目录">⟳</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="check-col"></th>
                <th>名称</th>
                <th class="size-col">大小</th>
                <th class="time-col">修改时间</th>
              </tr>
            </thead>
            <tbody id="krList"></tbody>
          </table>
        </div>
      </section>
    </section>

    <section class="status-panel">
      <div class="status-grid">
        <div>
          <div class="label">状态</div>
          <div id="statusText" class="value">空闲</div>
        </div>
        <div>
          <div class="label">当前项目</div>
          <div id="currentItem" class="value muted">-</div>
        </div>
        <div>
          <div class="label">任务 ID</div>
          <div id="taskId" class="value muted">-</div>
        </div>
      </div>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
      <pre id="logBox"></pre>
    </section>
  </main>

  <script src="/static/app.js?v=transfer-web-20260711-3"></script>
</body>
</html>
